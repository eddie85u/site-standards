# Copy to .github/workflows/checks.yml in the site repo.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/check-site.mjs --root {{site}} --domain {{domain}}
