<!-- Per-page head. Replace every {{PLACEHOLDER}}; keep the order. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Page topic}} | {{BRAND}}</title>
<meta name="description" content="{{140 to 160 characters, written for a person}}">
<link rel="canonical" href="https://{{DOMAIN}}/{{path}}">
<!-- Bilingual sites: one line per language, including this page, plus x-default -->
<link rel="alternate" hreflang="en" href="https://{{DOMAIN}}/{{path}}">
<link rel="alternate" hreflang="es" href="https://{{DOMAIN}}/es/{{path}}">
<link rel="alternate" hreflang="x-default" href="https://{{DOMAIN}}/{{path}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{BRAND}}">
<meta property="og:url" content="https://{{DOMAIN}}/{{path}}">
<!-- og:title without the brand: og:site_name already carries it (Meta and Apple advice) -->
<meta property="og:title" content="{{Page topic}}">
<meta property="og:description" content="{{Same idea as the meta description}}">
<meta property="og:image" content="https://{{DOMAIN}}/assets/og/{{page}}.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{What the image shows}}">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<!-- Google Search shows a raster icon of 48px or more; it does not list SVG as supported -->
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="{{#HEX}}">

<!-- Only the one or two fonts used above the fold. Font preloads need crossorigin, which
     Pages skips for Early Hints; to hint a font, add a Link header in _headers instead. -->
<link rel="preload" href="/assets/fonts/{{main-font}}.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
<script type="module" src="/assets/js/main.js"></script>
