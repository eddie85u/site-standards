<!doctype html>
<!-- 1200x630 share image (standard 06). Render per page with a headless browser, e.g.
     npx playwright screenshot --viewport-size=1200,630 "og-image-template.html?t=Monthly%20close" out.jpg
     Crop-safe: WhatsApp and iMessage show a square cut from the center, so the logo,
     brand and headline stay inside the central 630x630 column. The sides are background only.
     Swap the colors, font and logo for the brand. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; justify-content: center; color: #f2f4f3; font-family: system-ui, sans-serif;
    background: radial-gradient(520px 420px at 50% 42%, rgba(80, 160, 140, .30), transparent 70%), #0f1412; }
  .safe { width: 590px; height: 630px; box-sizing: border-box; padding: 56px 0 50px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; text-align: center; }
  .brand { font-size: 28px; font-weight: 600; letter-spacing: .02em; }
  h1 { font-size: 58px; line-height: 1.05; margin: 0; text-wrap: balance; }
  .url { font-size: 22px; opacity: .65; }
</style>
</head>
<body>
  <div class="safe">
    <div class="brand">{{BRAND}}</div>
    <h1 id="t">{{Page headline}}</h1>
    <div class="url">{{domain}}</div>
  </div>
  <script>
    const t = new URLSearchParams(location.search).get("t");
    if (t) document.getElementById("t").textContent = t;
  </script>
</body>
</html>
