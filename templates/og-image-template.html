<!doctype html>
<!-- 1200x630 share image. Render per page with a headless browser, e.g.
     npx playwright screenshot --viewport-size=1200,630 "og-image-template.html?t=Monthly%20close" out.jpg
     Swap the colors and font for the brand; keep text inside the 1000x500 safe area. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { display: grid; place-items: center; background: #0f1412; color: #f2f4f3; font-family: system-ui, sans-serif; }
  .safe { width: 1000px; height: 500px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-size: 28px; letter-spacing: .04em; opacity: .8; }
  h1 { font-size: 72px; line-height: 1.05; margin: 0; max-width: 900px; }
  .url { font-size: 24px; opacity: .6; }
</style>
</head>
<body>
  <div class="safe">
    <div class="brand">{{BRAND}}</div>
    <h1 id="t">{{Page headline}}</h1>
    <div class="url">{{domain}}</div>
  </div>
  <script>
    const t = new URLSearchParams(location.search).get("t");
    if (t) document.getElementById("t").textContent = t;
  </script>
</body>
</html>
